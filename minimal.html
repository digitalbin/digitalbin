<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/fav0.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digitalbin: the analogue catalogue</title>
    <meta name="description" content="this is the portfolio of albin hagström AKA digitalbin, a developer in stockholm, sweden">
    <link rel="canonical" href="https://digitalb.in/minimal.html">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://digitalb.in/minimal.html">
    <meta property="og:title" content="digitalbin: the analogue catalogue">
    <meta property="og:description" content="The portfolio of Albin Hagström AKA digitalbin, a developer in Stockholm, Sweden.">
    <meta property="og:image" content="https://digitalb.in/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-size: 16px;
            font-family: monospace;
        }
        div.content {
            display: grid;
            row-gap: 1.5rem;
            column-gap: 2.5rem;
            max-width: 56rem;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
        }
        h2 {
            font-size: 1.25rem;
        }

        a.back {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #fff;
            border: 0;
            border-bottom: 1px solid #000;
            padding: .5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            text-align: center;
        }

        contact-form form {
            display: grid;
            gap: 1rem;
            max-width: 24rem;
        }
        contact-form label {
            display: grid;
            gap: .25rem;
        }
        contact-form input,
        contact-form textarea {
            font: inherit;
            padding: .25rem .5rem;
            border: 1px solid #000;
        }
        contact-form input.gotcha {
            display: none;
        }
        contact-form button {
            font: inherit;
            font-weight: 700;
            justify-self: start;
            padding: .25rem 1rem;
            color: #fff;
            background: #000;
            border: 0;
            cursor: pointer;
        }
        contact-form p.status {
            margin: 0;
            font-weight: 700;
        }

        @media screen and (min-width: 768px) {
            div.content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>
</head>
<body><a class="back" href="/">&lt; back to cool version</a><div class="content"><!--content--></div>
<script type="module" src="/src/minimal.ts"></script>
</body></html>
