<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/fav0.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digitalbin: the analogue catalogue</title>
    <meta name="description" content="this is the portfolio of albin hagström AKA digitalbin, a developer in stockholm, sweden">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-size: 16px;
            font-family: monospace;
        }
        div.content {
            display: grid;
            row-gap: 1.5rem;
            column-gap: 2.5rem;
            max-width: 56rem;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
        }
        h2 {
            font-size: 1.25rem;
        }

        a.back {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #fff;
            border: 0;
            border-bottom: 1px solid #000;
            padding: .5rem;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            text-align: center;
        }

        @media screen and (min-width: 768px) {
            div.content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>
</head>
<body><a class="back" href="/">&lt; back to cool version</a><div class="content"><!--content--></div></body></html>
